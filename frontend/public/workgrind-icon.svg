<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <!--
    WorkGrind OG/Twitter/manifest icon — "Upward W"
    Used for social sharing and PWA metadata
  -->
  <defs>
    <linearGradient id="wg-og-main" x1="4" y1="28" x2="52" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="48%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="wg-og-dot" x1="24" y1="5" x2="32" y2="12" gradientUnits="userSpaceOnUse">
